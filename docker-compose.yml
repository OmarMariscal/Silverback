services:
  db:
    image: postgres:15-alpine
    container_name: silverback_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-silverback}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - silverback_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-silverback}"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3_storage:
    image: chrislusf/seaweedfs:latest
    container_name: silverback_s3_dev
    ports:
      - "9000:8333" # API S3 (Idéntico a AWS S3)
      - "9001:8888" # Visor Web de Archivos y Buckets (http://localhost:9001)
    command: >
      server -dir=/data 
      -filer=true 
      -s3=true 
      -s3.port=8333 
      -s3.config=/etc/seaweedfs/s3-config.json 
      -s3.allowEmptyFolder=true
    volumes:
      - s3_data_dev:/data
      - ./backend/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    networks:
      - silverback_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: silverback_api_dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-silverback}?schema=public
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_dev_user}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_dev_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-silverback-evidencias}
      # Comunicación interna entre contenedores
      S3_ENDPOINT: http://s3_storage:8333
      # Firma pública para el navegador (Apunta al puerto 9000 expuesto en tu máquina)
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      db:
        condition: service_healthy
      s3_storage:
        condition: service_started
    networks:
      - silverback_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: silverback_web_dev
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    networks:
      - silverback_network

volumes:
  pgdata_dev:
  s3_data_dev:

networks:
  silverback_network:
    driver: bridge