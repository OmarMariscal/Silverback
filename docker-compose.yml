version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: silverback_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-silverback}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - silverback_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: silverback_api_dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-silverback}?schema=public
    depends_on:
      - db
    networks:
      - silverback_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: silverback_web_dev
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
    networks:
      - silverback_network

volumes:
  pgdata_dev:

networks:
  silverback_network:
    driver: bridge